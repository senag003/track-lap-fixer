<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<meta charset="utf-8">
<title>Track Lap Fixer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1b36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Lap Fixer">
<link rel="apple-touch-icon" href="icon-180.png">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23e2512b'/%3E%3Crect x='8' y='17' width='48' height='30' rx='15' fill='none' stroke='%23fff' stroke-width='4'/%3E%3Cpath d='M40 11v12' stroke='%230f1b36' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M24.5 32.5l5 5 10-11' fill='none' stroke='%23fff' stroke-width='4.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: navy "stadium" band with the track oval and the four steps, then one working column that follows those steps. Tartan orange marks what you change. */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --surface-2:#f7f8fb; --ink:#111a2e; --muted:#5a6680; --line:#dde2ec;
  --band:#0f1b36; --band-ink:#ffffff; --band-muted:#a9b6d3; --lane:#2c3d66;
  --accent:#e2512b; --accent-ink:#ffffff; --accent-soft:#fde9e2;
  --blue:#2f5fd0; --blue-soft:#e4ebfb; --green:#1d8a5c;
  --good:#16805f; --good-soft:#dff3eb; --warn:#a35a06; --warn-soft:#fcf0dc;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1020; --surface:#121b30; --surface-2:#0f172a; --ink:#e8edf7; --muted:#97a3bd; --line:#26324d;
  --band:#060b18; --band-ink:#ffffff; --band-muted:#94a3c4; --lane:#1d2a4a;
  --accent:#ff7a52; --accent-ink:#1a0d07; --accent-soft:#3a1d14;
  --blue:#86a8ff; --blue-soft:#1b2a4f; --green:#4fd19a;
  --good:#4fd1a3; --good-soft:#103629; --warn:#f2b66a; --warn-soft:#3a2a14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1020; --surface:#121b30; --surface-2:#0f172a; --ink:#e8edf7; --muted:#97a3bd; --line:#26324d;
  --band:#060b18; --band-ink:#ffffff; --band-muted:#94a3c4; --lane:#1d2a4a;
  --accent:#ff7a52; --accent-ink:#1a0d07; --accent-soft:#3a1d14;
  --blue:#86a8ff; --blue-soft:#1b2a4f; --green:#4fd19a;
  --good:#4fd1a3; --good-soft:#103629; --warn:#f2b66a; --warn-soft:#3a2a14; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);margin:0}
.in{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.02;text-wrap:balance}
h1{font-size:clamp(2.6rem,6vw,4rem);font-weight:800;font-style:italic;letter-spacing:-.01em;text-transform:uppercase}
h2{font-size:1.9rem;font-weight:700;font-style:italic;text-transform:uppercase;letter-spacing:.01em}
h3{font-size:1.25rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.band{background:var(--band);color:var(--band-ink);overflow:hidden}
.band .in{padding-block:22px 26px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px 24px;align-items:center}
.topbar{grid-column:1/-1;display:flex;justify-content:flex-end}
.langsel{display:flex;align-items:center;gap:8px;color:var(--band-muted);font-size:.85rem;font-weight:600}
.langsel select{background:var(--band);color:var(--band-ink);border:1px solid var(--lane);border-radius:999px;padding:5px 12px;font:600 .9rem var(--f-body)}
.band p.lead{color:var(--band-muted);font-size:1.08rem;max-width:52ch;margin-top:10px}
.band h1 span{color:var(--accent)}
.oval{width:100%;max-width:300px;height:auto;justify-self:end}
.oval .ln{fill:none;stroke:var(--lane);stroke-width:7}
.oval .lw{fill:none;stroke:var(--band-muted);stroke-width:1;opacity:.55}
.oval .fin{stroke:var(--band-ink);stroke-width:2}
.oval circle{fill:var(--accent)}
.steps{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 0;padding:0;list-style:none}
.steps a{display:flex;align-items:center;gap:10px;color:var(--band-ink);text-decoration:none;padding:7px 14px 7px 7px;border:1px solid var(--lane);border-radius:999px;font-weight:600;font-size:.95rem}
.steps a:hover{border-color:var(--accent)}
.steps b{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 1rem var(--f-display)}

main .in{display:flex;flex-direction:column;gap:44px;padding-block:34px 110px}
section{display:flex;flex-direction:column;gap:16px;scroll-margin-top:16px}
.sh{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.num{font:800 italic 2.6rem/1 var(--f-display);color:var(--accent)}
.sh p{flex:0 0 100%;color:var(--muted);max-width:70ch}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.btn{font:600 .95rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-size:1.05rem;padding:12px 22px}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:.82rem}
input[type=number],select{font:500 1rem var(--f-body);font-variant-numeric:tabular-nums;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
input[type=number]{width:6.2em}
input:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
label.l{font-size:.85rem;font-weight:600;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.unit{color:var(--muted);font-size:.85rem}

.drop{border:2px dashed var(--line);border-radius:var(--r);background:var(--surface);padding:22px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .file{display:flex;gap:14px;align-items:center;min-width:0}
.drop svg{flex:none}
.drop .name{font-weight:700;font-size:1.1rem;overflow-wrap:anywhere}
.tag{display:inline-block;font:700 .7rem var(--f-body);letter-spacing:.09em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn);margin-right:6px;vertical-align:2px}
.how2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.how2 .card{padding:14px 16px}
.how2 b{display:block;margin-bottom:2px}
.how2 span{color:var(--muted);font-size:.93rem}
.msg{padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-weight:500}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:12px 16px;min-width:0}
.stat .k{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat .v{font:700 1.9rem/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat .v small{font:500 .95rem var(--f-body);color:var(--muted);margin-left:3px}
.stat .was{font-size:.82rem;color:var(--muted)}
.stat.ch .v{color:var(--accent)}
.charts{display:flex;flex-direction:column;gap:6px}
.chart-head{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.chips{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface-2)}
.chips button{font:600 .85rem var(--f-body);border:0;background:none;color:var(--muted);padding:4px 12px;border-radius:999px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--surface)}
.plot{position:relative}
.plot svg{display:block;width:100%;height:auto;overflow:visible}
.plot text{font:500 11px var(--f-body);fill:var(--muted)}
.plot .grid{stroke:var(--line);stroke-width:1}
.plot .lapline{stroke:var(--line);stroke-width:1;stroke-dasharray:2 3}
.plot .series{fill:none;stroke-width:2;stroke-linejoin:round}
.plot .cut{fill:var(--muted);opacity:.14}
.plot .cutline{stroke:var(--accent);stroke-width:2}
.plot .bar{fill:var(--blue)}
.plot .bar.ch{fill:var(--accent)}
.plot .xh{stroke:var(--ink);stroke-width:1;opacity:.5}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:.82rem;padding:6px 10px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%);z-index:3;line-height:1.35;font-variant-numeric:tabular-nums}

.tool-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.tool-head p{color:var(--muted);font-size:.93rem;max-width:68ch;margin-top:3px}
.when{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue)}
.bulk{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;padding:12px;background:var(--surface-2);border-radius:8px;margin-bottom:12px}
.sheet{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
#laps{min-width:760px}
th{font:700 .72rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tbody tr:last-child td{border-bottom:0}
tfoot td{border-top:2px solid var(--line);border-bottom:0;font-weight:700}
td.lap{font:700 1.25rem var(--f-display)}
td.lap small{display:block;font:600 .72rem var(--f-body);color:var(--blue);letter-spacing:.04em}
td.dim{color:var(--muted)}
.edit{display:inline-flex;align-items:center;gap:4px}
.step{width:30px;height:32px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;cursor:pointer;font:600 1.05rem var(--f-body);line-height:1}
.step:hover{border-color:var(--accent);color:var(--accent)}
tr.ch td{background:var(--accent-soft)}
tr.ch input{border-color:var(--accent)}
tr.ch td.pace{color:var(--accent);font-weight:700}
tr.cut td{opacity:.4}
.icon-btn{border:1px solid transparent;background:none;color:var(--muted);cursor:pointer;font:600 .8rem var(--f-body);padding:4px 8px;border-radius:6px}
.icon-btn:hover{border-color:var(--line);color:var(--ink)}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.tools .card p.muted{font-size:.93rem;margin:4px 0 12px}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.seg label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.seg input{margin-top:4px;accent-color:var(--accent)}
.seg b{display:block}
.seg span{font-size:.88rem;color:var(--muted)}

/* preview */
.pv{display:flex;flex-direction:column;gap:18px}
.pv-head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end}
.pv-title b{display:block;font:700 1.6rem/1.1 var(--f-display)}
.pv-title span{color:var(--muted);font-size:.9rem}
.pv-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px 18px}
.pv-stats .k{font-size:.78rem;color:var(--muted);font-weight:600}
.pv-stats .v{font:700 1.55rem/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.pv-stats .v small{font:500 .85rem var(--f-body);color:var(--muted);margin-left:2px}
.pv-stats .big .v{font-size:2.1rem}
.pv-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
#pvMap svg{max-width:560px}
.pv-grid>div{min-width:0}
.pv h4{font:700 1rem var(--f-display);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px;color:var(--muted)}
.pv .mini th,.pv .mini td{padding:5px 8px;font-size:.88rem}
.pbar{display:block;height:6px;border-radius:3px;background:var(--blue);min-width:2px}
.map{background:var(--surface-2);border-radius:8px;display:block;width:100%;height:auto}
.map path{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.nomap{background:var(--surface-2);border-radius:8px;padding:18px;color:var(--muted);font-size:.9rem}
.pv .note{color:var(--muted);font-size:.84rem}
.lbl{font:600 .8rem var(--f-body);color:var(--muted);margin:6px 0 0}

.checks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.checks li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--surface-2)}
.checks .ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.8rem;margin-top:1px}
.ok .ic{background:var(--good-soft);color:var(--good)}
.chg .ic{background:var(--accent-soft);color:var(--accent)}
.bad .ic{background:var(--warn-soft);color:var(--warn)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.cols h3{margin-bottom:10px}

a.btn{text-decoration:none}
.linkbtn{margin-top:10px;align-self:flex-start}
.how2 .card{display:flex;flex-direction:column}
.orig-list{display:grid;gap:6px}
.orig-row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.orig-row b{overflow-wrap:anywhere}
.orig-row .hint{display:block}
/* brand */
.brand{display:flex;align-items:center;gap:16px}
.logo{width:64px;height:64px;flex:none;filter:drop-shadow(0 6px 14px rgba(0,0,0,.25))}
@media (max-width:520px){.logo{width:48px;height:48px}}

/* main tool + more tools */
.main-tool{border:2px solid var(--accent);position:relative}
.badge{display:inline-flex;align-items:center;gap:6px;font:700 .72rem var(--f-body);letter-spacing:.09em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:3px 10px;border-radius:999px;margin-bottom:8px}
.more-head{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.more-head p{color:var(--muted);max-width:70ch}
.tgroups{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;align-items:start}
.tgroup{display:flex;flex-direction:column;gap:10px;min-width:0}
.tgroup h4{margin:0;font:700 .8rem var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--blue)}
details.tool{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
details.tool[open]{border-color:var(--ink)}
details.tool.on{border-color:var(--accent)}
details.tool summary{list-style:none;display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;border-radius:var(--r)}
details.tool summary::-webkit-details-marker{display:none}
details.tool summary:hover{background:var(--surface-2)}
.tic{width:36px;height:36px;border-radius:9px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center}
details.tool.on .tic{background:var(--accent-soft);color:var(--accent)}
.tic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ttl b{display:block;font-weight:700}
.ttl span{display:block;color:var(--muted);font-size:.86rem;line-height:1.35}
.tright{display:flex;align-items:center;gap:8px}
.chip-on{font:700 .68rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:2px 8px;border-radius:999px}
.chev{width:16px;height:16px;transition:transform .15s;stroke:var(--muted);fill:none;stroke-width:2}
details.tool[open] .chev{transform:rotate(180deg)}
.tbody{padding:4px 16px 16px;display:flex;flex-direction:column;gap:10px}
.tbody p{color:var(--muted);font-size:.92rem}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.85rem;font-weight:600}
.checklist{display:grid;gap:6px}
.checklist label{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.checklist label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.checklist label.na{opacity:.5;cursor:not-allowed}
.checklist input{accent-color:var(--accent)}
.hint{font-size:.85rem;color:var(--muted)}
input[type=datetime-local]{font:500 1rem var(--f-body);padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}

.save{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.save p{max-width:60ch}
ol.up{margin:8px 0 0;padding-left:1.2em;display:grid;gap:6px}
ol.up li{padding-left:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-weight:600;max-width:calc(100% - 32px);z-index:9}
.plot{touch-action:pan-y}
.kind{display:block;font:700 .68rem var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.kind.rest{color:var(--blue)}
.tpl input[type=text]{width:9em}
.txt{width:100%;font:500 1rem var(--f-body);padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);resize:vertical}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface);overflow:hidden}
.chip button{border:0;background:none;color:var(--ink);font:600 .85rem var(--f-body);padding:5px 10px;cursor:pointer}
.chip button+button{color:var(--muted);padding-left:2px}
#laps td.splitcell{background:var(--surface-2);white-space:normal;text-align:left;padding:12px}
.mbar{display:flex;position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:8;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 8px 24px rgba(10,16,32,.22)}
.ic-btn{width:44px;height:44px;padding:0;justify-content:center;flex:none}
.ic-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mbar-txt{font-size:.85rem;font-weight:600;font-variant-numeric:tabular-nums;padding:0 6px;white-space:nowrap}
@media (max-width:720px){
  #lapsSheet{overflow:visible;border:0;border-radius:0}
  #laps{min-width:0;display:block}
  #laps thead{display:none}
  #laps tbody,#laps tfoot{display:block}
  #laps tr{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--surface)}
  #laps tr.ch{background:var(--accent-soft);border-color:var(--accent)}

      recNew.set(r,{d,v});
      const vv=v!=null?v:r.speed; if(vv!=null) maxV=Math.max(maxV,vv);
    }
    info.push({g,maxV,how}); if(how!=="shift") shift+=D-Math.max(0,od);
  }
  for(const r of model.records){
    if(r.ts!=null&&(r.ts<T0||r.ts>T)){drop.add(r.m);continue;}
    const n=recNew.get(r);
    if(n){ if(Math.abs(n.d-(r.dist??-1))>0.004) wr(dv,r.m,5,n.d*100); if(n.v!=null){wr(dv,r.m,6,n.v*1000);wr(dv,r.m,73,n.v*1000);} }
    if(ov.hr&&ov.hr.has(r)) wr(dv,r.m,3,ov.hr.get(r));
    if(ov.pwr&&ov.pwr.has(r)) wr(dv,r.m,7,ov.pwr.get(r));
  }
  const first=new Map(G.map((g,k)=>[g.laps[0],k]));
  model.laps.forEach((L,i)=>{
    const k=first.get(i); if(k==null){drop.add(L.m);return;}
    const {g,maxV}=info[k], m=L.m, D=g.dist, tt=g.timer, avg=tt>0?D/tt:0, mx=Math.max(maxV,avg);
    if(isChanged(g)||!g.pristine){wr(dv,m,9,D*100);wr(dv,m,13,avg*1000);wr(dv,m,110,avg*1000);wr(dv,m,14,mx*1000);wr(dv,m,111,mx*1000);}
    const s=statsOf(g.recs,ov);
    if(!g.pristine){
      if(model.laps[g.laps[g.laps.length-1]].tsIsEnd) wr(dv,m,253,g.end);
      if(g.clipStart) wr(dv,m,2,g.start);
      wr(dv,m,7,g.elapsed*1000); wr(dv,m,8,tt*1000);
      wr(dv,m,17,s.avgCad); wr(dv,m,18,s.maxCad);
      if(g.laps.length>1){
        for(const num of [10,11,21,22]){let sum=0,any=false;for(const j of g.laps){const v=rd(src.dv,model.laps[j].m,num);if(v!=null){sum+=v;any=true;}}if(any)wr(dv,m,num,sum);}
        const last=model.laps[g.laps[g.laps.length-1]].m; copyField(out,m,last,5); copyField(out,m,last,6);
      }
    }
    if(!g.pristine||ov.hr){wr(dv,m,15,s.avgHr); wr(dv,m,16,s.maxHr);}
    if(!g.pristine||ov.pwr){wr(dv,m,19,s.avgPwr); wr(dv,m,20,s.maxPwr);}
    if(merged||cropped) wr(dv,m,254,k);
    if(sp){wr(dv,m,25,sp[1]);wr(dv,m,39,sp[2]);}
  });
  model.sessions.forEach((S,si)=>{
    if(si>0&&S.start!=null&&(S.start>=T||S.end<=T0)){drop.add(S.m);return;}
    const inS=g=>model.sessions.length===1||(g.start>=S.start&&g.start<S.end);
    const gs=G.filter(inS), dist=gs.reduce((a,g)=>a+g.dist,0);
    if(anyDist||merged||cropped){
      const timer=cropped?gs.reduce((a,g)=>a+g.timer,0):S.timer, avg=timer>0?dist/timer:0;
      const mx=Math.max(avg,...info.filter(x=>inS(x.g)).map(x=>Math.max(x.maxV,x.g.timer>0?x.g.dist/x.g.timer:0)));
      wr(dv,S.m,9,dist*100); wr(dv,S.m,14,avg*1000); wr(dv,S.m,124,avg*1000); wr(dv,S.m,15,mx*1000); wr(dv,S.m,125,mx*1000);
      if(cropped){
        const st=Math.max(S.start,T0), end=Math.min(S.end,T);
        if(F.cropS) wr(dv,S.m,2,st);
        if(S.tsIsEnd&&F.cropE) wr(dv,S.m,253,end);
        wr(dv,S.m,7,(end-st)*1000); wr(dv,S.m,8,Math.min(timer,end-st)*1000);
        const s=statsOf(gs.flatMap(g=>g.recs),ov); wr(dv,S.m,18,s.avgCad); wr(dv,S.m,19,s.maxCad);
      }
      if(merged||cropped) wr(dv,S.m,26,gs.length);
    }
    if(statsDirty){const s=statsOf(gs.flatMap(g=>g.recs),ov); wr(dv,S.m,16,s.avgHr); wr(dv,S.m,17,s.maxHr); if(ov.pwr||cropped){wr(dv,S.m,20,s.avgPwr); wr(dv,S.m,21,s.maxPwr);}}
    if(sp){wr(dv,S.m,5,sp[1]);wr(dv,S.m,6,sp[2]);}
  });
  if(sp) for(const s of model.sports){wr(dv,s.m,0,sp[1]);wr(dv,s.m,1,sp[2]);}
  if(cropped){
    let keptStop=false, keptStart=false;
    for(const e of model.events){
      if(e.ts==null) continue;
      if(e.ts>T){ if(e.ev===0&&[1,4,8,9].includes(e.type)&&!keptStop){keptStop=true;wr(dv,e.m,253,T);} else drop.add(e.m); }
      else if(e.ts<T0){ if(e.ev===0&&e.type===0&&!keptStart){keptStart=true;wr(dv,e.m,253,T0);} else drop.add(e.m); }
    }
    const timer=G.reduce((a,g)=>a+g.timer,0);
    for(const a of model.acts){const ts=a.m.ts; if(F.cropE&&ts!=null&&ts>T){const lt=rd(src.dv,a.m,5); wr(dv,a.m,253,T); if(lt!=null) wr(dv,a.m,5,lt-(ts-T));} wr(dv,a.m,0,timer*1000);}
    for(const m of src.msgs){
      if(m.g===20||m.g===21||drop.has(m)) continue;
      const ts=rd(dv,m,253); if(ts==null) continue;
      if(ts>T&&m.g!==34) wr(dv,m,253,T); else if(ts<T0) wr(dv,m,253,T0);
    }
  }
  for(const k of F.removed){
    const R=REMOVE_FIELDS[k];
    for(const r of model.records) if(!drop.has(r.m)) for(const n of R.rec) wrInvalid(out,r.m,n);
    for(const L of model.laps) if(!drop.has(L.m)) for(const n of R.lap) wrInvalid(out,L.m,n);
    for(const S of model.sessions) if(!drop.has(S.m)) for(const n of R.ses) wrInvalid(out,S.m,n);
  }
  if(F.device&&model.fileId){
    wr(dv,model.fileId,1,1); wr(dv,model.fileId,2,F.device);
    for(const m of model.devs) if(rd(src.dv,m,0)===0){ wr(dv,m,2,1); wr(dv,m,4,F.device); }
  }
  if(E.fileCreated!=null&&model.fileId) wr(dv,model.fileId,4,E.fileCreated);
  if(F.shift){
    for(const m of src.msgs){
      if(drop.has(m)) continue;
      for(const n of [253,...(TIME_FIELDS[m.g]||[])]){ const v=rd(dv,m,n); if(v!=null&&v>0x10000000) wr(dv,m,n,v+F.shift); }
    }
  }
  // records without a heart-rate field get one when heart rate is imported
  if(ov.hr&&ov.hr.size){
    for(const c of src.chunks){
      if(c.kind!=="def"||c.d.g!==20||c.d.fields[3]) continue;
      const ob=out.subarray(c.start,c.end), nb=new Uint8Array(ob.length+3), fe=6+c.n*3;
      nb.set(ob.subarray(0,fe)); nb[5]=c.n+1; nb[fe]=3; nb[fe+1]=1; nb[fe+2]=2; nb.set(ob.subarray(fe),fe+3); repl.set(c,nb);
    }
    for(const r of model.records){
      const dc=r.m.defChunk; if(drop.has(r.m)||!repl.has(dc)) continue;
      const head=r.m.off-r.m.start, ns=r.m.d.normSize, ob=out.subarray(r.m.start,r.m.end), nb=new Uint8Array(ob.length+1);
      nb.set(ob.subarray(0,head+ns)); const v=ov.hr.get(r); nb[head+ns]=v==null?0xFF:Math.min(254,v); nb.set(ob.subarray(head+ns),head+ns+1); repl.set(r.m,nb);
    }
  }
  const file=assemble(src,out,drop,repl,null);
  return {file,G,anyDist,merged,cropped,F,fixedHr:ov.hr?ov.hr.spikes:0,importedHr:ov.hr?ov.hr.imported:0,fixedPwr:ov.pwr?ov.pwr.size:0};
}

/* ================= Re-read the new file and compare ================= */
function verify(model,E,file,G){
  const res={ok:true,items:[]}; let fit2, m2;
  try{fit2=parseFit(file);m2=buildModel(fit2);}catch(e){return {ok:false,error:e.message};}
  res.model=m2;
  const F=editFlags(model,E), T0=F.cropS?E.cropStart:-Infinity, T=F.cropE?E.trim:Infinity;
  const crcOk=fitCrc(file,0,fit2.end)===(file[fit2.end]|file[fit2.end+1]<<8);
  const a=model.records.filter(r=>r.ts==null||(r.ts>=T0&&r.ts<=T)), b=m2.records;
  const SKIP=new Set([5,6,73]); if(F.shift) SKIP.add(253); if(F.spike||F.imp) SKIP.add(3); if(F.pwrMax) SKIP.add(7);
  for(const k of F.removed) for(const n of REMOVE_FIELDS[k].rec) SKIP.add(n);
  const hov=hrOverrides(model,E,a,F);
  let identical=0, hrN=0, hrSame=0, hrChanged=0, cadN=0, cadSame=0, tsSame=0, posN=0, posSame=0;
  const n=Math.min(a.length,b.length), A=model.fit.bytes, B=file;
  for(let k=0;k<n;k++){
    const x=a[k], y=b[k], fx=x.m.d.fields, fy=y.m.d.fields; let same=true;
    for(const num in fx){ if(SKIP.has(+num)) continue; const f=fx[num], g=fy[num]; if(!g||g.size!==f.size){same=false;break;}
      for(let i=0;i<f.size;i++) if(A[x.m.off+f.o+i]!==B[y.m.off+g.o+i]){same=false;break;} if(!same) break; }
    if(same){ const dx=x.m.d.size-x.m.d.normSize; if(dx!==y.m.d.size-y.m.d.normSize) same=false; else for(let i=0;i<dx;i++) if(A[x.m.off+x.m.d.normSize+i]!==B[y.m.off+y.m.d.normSize+i]){same=false;break;} }
    if(same) identical++;
    if(hov&&hov.has(x)){ hrChanged++; if(y.hr===hov.get(x)) hrSame++; hrN++; }
    else if(x.hr!=null){hrN++; if(x.hr===y.hr) hrSame++;}
    if(x.cad!=null){cadN++; if(x.cad===y.cad) cadSame++;}
    if(x.ts===null||y.ts===x.ts+F.shift) tsSame++;
    if(x.lat!=null){posN++; if(x.lat===y.lat&&x.lon===y.lon) posSame++;}
  }
  let mono=true, prevD=-1, maxV=0;
  for(const r of b){ if(r.dist!=null){ if(r.dist<prevD-0.001) mono=false; prevD=r.dist;} if(r.speed!=null) maxV=Math.max(maxV,r.speed); }
  const f=x=>fmtInt(x), rm=F.removed;
  res.items.push({ok:crcOk,t:t(crcOk?"v_crc_ok":"v_crc_bad")});
  res.items.push({ok:a.length===b.length,t:t("v_pts",{a:f(b.length),b:f(a.length),c:(F.cropS||F.cropE)?t("v_pts_trim"):""})});
  if(rm.includes("hr")) res.items.push({ok:b.every(r=>r.hr==null),t:t("v_removed",{x:t("rm_hr")})});
  else if(hov) res.items.push({ok:hrSame===hrN,t:t("v_hr_changed",{a:f(hrChanged),b:f(hrN-hrChanged)})});
  else if(hrN) res.items.push({ok:hrSame===hrN,t:t("v_hr",{a:f(hrSame),b:f(hrN)})});
  if(rm.includes("cad")) res.items.push({ok:b.every(r=>r.cad==null),t:t("v_removed",{x:t("rm_cad")})});
  else if(cadN) res.items.push({ok:cadSame===cadN,t:t("v_cad",{a:f(cadSame),b:f(cadN)})});
  if(rm.includes("pwr")) res.items.push({ok:b.every(r=>r.pwr==null),t:t("v_removed",{x:t("rm_pwr")})});
  if(rm.includes("alt")) res.items.push({ok:b.every(r=>r.alt==null),t:t("v_removed",{x:t("rm_alt_short")})});
  res.items.push({ok:tsSame===n,t:F.shift?t("v_ts_shift",{n:f(tsSame)}):t("v_ts",{a:f(tsSame),b:f(n)})});
  if(rm.includes("gps")) res.items.push({ok:b.every(r=>r.lat==null),t:t("v_removed",{x:t("rm_gps_short")})});
  else res.items.push({ok:posSame===posN,t:posN?t("v_pos",{a:f(posSame),b:f(posN)}):t("v_nopos")});
  res.items.push({ok:identical===n,t:t("v_rest",{a:f(identical),b:f(n)})});
  res.items.push({ok:mono,t:t(mono?"v_mono_ok":"v_mono_bad")});
  if(G){
    let bad=0, n2=0;
    G.forEach((g,k)=>{ if(!isChanged(g)||!m2.laps[k]) return; const L2=m2.laps[k], wd=L2.records.filter(r=>r.dist!=null); if(!wd.length) return; n2++;
      const span=wd[wd.length-1].dist-L2.origStart; if(Math.abs(span-g.dist)>Math.max(1,0.01*g.dist)) bad++; });
    if(n2) res.items.push({ok:bad===0,t:bad?t("v_span_bad",{n:bad}):t("v_span_ok",{n:n2})});
  }
  if(F.device) res.items.push({ok:m2.product===F.device,t:t("v_device",{x:(DEVICES.find(d=>d[1]===F.device)||["?"])[0]})});
  const plaus=PACE_SPORTS.includes(model.sport??1)?maxV<11:maxV<40;
  res.items.push({ok:plaus,warn:true,t:t(plaus?"v_speed_ok":"v_speed_bad",{x:fmtDec(maxV*3.6,1)})});
  res.ok=res.items.every(i=>i.ok||i.warn);
  return res;
}

/* ================= What Strava-style apps will show (from a parsed file) ================= */
function summarize(model){
  const recs=model.records.filter(r=>r.ts!=null), S=model.sessions[0], dv=model.fit.dv;
  const pace=PACE_SPORTS.includes(model.sport??1), minV=pace?0.5:1;
  const withD=recs.filter(r=>r.dist!=null);
  const d0=withD.length&&withD[0].dist>50?withD[0].dist:0;
  const dist=withD.length?withD[withD.length-1].dist-d0:(S?S.dist:model.laps.reduce((a,L)=>a+L.dist,0));
  let moving=0;
  for(let i=1;i<recs.length;i++){
    const a=recs[i-1], b=recs[i], dt=b.ts-a.ts; if(b.gap||dt<=0) continue;
    if(a.dist!=null&&b.dist!=null){ if((b.dist-a.dist)/dt>=minV) moving+=dt; } else moving+=dt;
  }
  if(!withD.length) moving=S?S.timer:moving;
  const elapsed=S&&S.elapsed?S.elapsed:(model.t1-model.t0);
  let elev=S?rd(dv,S.m,22):null;
  if(elev==null){ let g=0, ref=null; for(const r of recs){ if(r.alt==null) continue; if(ref==null) ref=r.alt; else if(r.alt-ref>=1){g+=r.alt-ref;ref=r.alt;} else if(r.alt<ref) ref=r.alt; } elev=recs.some(r=>r.alt!=null)?g:null; }
  const cal=S?rd(dv,S.m,11):null;
  const st=statsOf(recs);
  const avgHr=(S&&rd(dv,S.m,16))??st.avgHr, maxHr=(S&&rd(dv,S.m,17))??st.maxHr;
  const avgCad=(S&&rd(dv,S.m,18))??st.avgCad;
  const splits=[];
  if(withD.length){
    let mv=0, hrs=[], altStart=null, lastAlt=null, started=false, next=d0+1000;
    for(let i=0;i<recs.length;i++){
      const r=recs[i]; if(r.dist==null) continue;
      if(!started){started=true; altStart=r.alt;}
      if(i>0&&!r.gap){const p=recs[i-1]; if(p.dist!=null){const dt=r.ts-p.ts; if(dt>0&&(r.dist-p.dist)/dt>=minV) mv+=dt;}}
      if(r.hr!=null) hrs.push(r.hr); if(r.alt!=null) lastAlt=r.alt;
      while(r.dist>=next){
        splits.push({km:(next-d0)/1000,dist:1000,moving:mv,hr:hrs.length?hrs.reduce((a,b)=>a+b,0)/hrs.length:null,elev:altStart!=null&&lastAlt!=null?lastAlt-altStart:null});
        mv=0; hrs=[]; altStart=lastAlt; next+=1000;
      }
    }
    const rest=dist-(next-1000-d0);
    if(rest>=50) splits.push({km:dist/1000,dist:rest,moving:mv,hr:hrs.length?hrs.reduce((a,b)=>a+b,0)/hrs.length:null,elev:altStart!=null&&lastAlt!=null?lastAlt-altStart:null,partial:true});
  }
  const series=[]; let j=0;
  for(let i=0;i<recs.length;i++){
    const r=recs[i]; if(r.dist==null) continue;
    while(j<i&&r.ts-recs[j].ts>15) j++;
    const a=recs[j]; let v=null;
    if(a&&a!==r&&a.dist!=null&&r.ts>a.ts) v=(r.dist-a.dist)/(r.ts-a.ts); else if(r.speed!=null) v=r.speed;
    series.push({d:r.dist-d0,v,hr:r.hr,cad:r.cad,ts:r.ts});
  }
  const route=recs.filter(r=>r.lat!=null&&r.lon!=null).map(r=>[r.lat*180/2**31,r.lon*180/2**31]);
  const laps=model.laps.map(L=>{const m=L.m;return {dist:L.dist,timer:L.timer,hr:rd(dv,m,15)};});
  return {dist,moving,elapsed,elev,cal,avgHr,maxHr,avgCad,splits,series,route,laps,sport:model.sport,sub:model.sub,start:model.t0};
}

/* ================= Exports: CSV, TCX, GPX ================= */

function csvLaps(model){

}
function csvPoints(model){

function tcxOf(model){
  const dv=model.fit.dv, run=PACE_SPORTS.includes(model.sport??1), sport=model.sport===1?"Running":model.sport===2?"Biking":"Other";
  let x=`<?xml version="1.0" encoding="UTF-8"?>\n<TrainingCenterDatabase xmlns="http://www.garmin.com/xmlschemas/TrainingCenterDatabase/v2" xmlns:ns3="http://www.garmin.com/xmlschemas/ActivityExtension/v2">\n<Activities><Activity Sport="${sport}"><Id>${iso(model.t0)}</Id>\n`;
  for(const L of model.laps){

    x+=`<Lap StartTime="${iso(L.start)}"><TotalTimeSeconds>${L.timer.toFixed(1)}</TotalTimeSeconds><DistanceMeters>${L.dist.toFixed(2)}</DistanceMeters>${ms!=null?`<MaximumSpeed>${(ms/1000).toFixed(3)}</MaximumSpeed>`:""}<Calories>${cal}</Calories>${ah!=null?`<AverageHeartRateBpm><Value>${ah}</Value></AverageHeartRateBpm>`:""}${mh!=null?`<MaximumHeartRateBpm><Value>${mh}</Value></MaximumHeartRateBpm>`:""}<Intensity>Active</Intensity><TriggerMethod>Manual</TriggerMethod><Track>\n`;
    for(const r of L.records){
      if(r.ts==null) continue;
      x+=`<Trackpoint><Time>${iso(r.ts)}</Time>${r.lat!=null?`<Position><LatitudeDegrees>${(r.lat*180/2**31).toFixed(7)}</LatitudeDegrees><LongitudeDegrees>${(r.lon*180/2**31).toFixed(7)}</LongitudeDegrees></Position>`:""}${r.alt!=null?`<AltitudeMeters>${r.alt.toFixed(1)}</AltitudeMeters>`:""}${r.dist!=null?`<DistanceMeters>${r.dist.toFixed(2)}</DistanceMeters>`:""}${r.hr!=null?`<HeartRateBpm><Value>${r.hr}</Value></HeartRateBpm>`:""}${!run&&r.cad!=null?`<Cadence>${r.cad}</Cadence>`:""}${r.speed!=null||(run&&r.cad!=null)?`<Extensions><ns3:TPX>${r.speed!=null?`<ns3:Speed>${r.speed.toFixed(3)}</ns3:Speed>`:""}${run&&r.cad!=null?`<ns3:RunCadence>${r.cad}</ns3:RunCadence>`:""}</ns3:TPX></Extensions>`:""}</Trackpoint>\n`;
    }

function gpxOf(model){
  let x=`<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Track Lap Fixer" xmlns="http://www.topografix.com/GPX/1/1" xmlns:gpxtpx="http://www.garmin.com/xmlschemas/TrackPointExtension/v1">\n<metadata><time>${iso(model.t0)}</time></metadata>\n<trk><name>${esc0(sportName(model.sport,model.sub))}</name><trkseg>\n`;
  for(const r of model.records){

async function fitFromZip(u8){
  const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  let e=-1; for(let i=u8.length-22;i>=Math.max(0,u8.length-66000);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break;}}
  if(e<0) throw new Error(t("e_zip"));
  const count=dv.getUint16(e+10,true); let p=dv.getUint32(e+16,true);
  for(let k=0;k<count;k++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), xl=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), lo=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.subarray(p+46,p+46+nl)); p+=46+nl+xl+cl;
    if(!/\.(fit|tcx|gpx)$/i.test(name)) continue;
    const st=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true), raw=u8.slice(st,st+csize);
    if(method===0) return {name:name.split("/").pop(),bytes:raw};
    if(method===8){
      if(typeof DecompressionStream==="undefined") throw new Error(t("e_unzip_browser"));
      const ab=await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer();
      return {name:name.split("/").pop(),bytes:new Uint8Array(ab)};
    }
    throw new Error(t("e_zip_method"));
  }
  throw new Error(t("e_zip_nofit"));
}
const CRC32=(()=>{const tb=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;tb[n]=c>>>0;}return tb;})();

function makeZip(name,data){
  if(typeof data==="string") data=new TextEncoder().encode(data);
  const nb=new TextEncoder().encode(name), crc=crc32(data), n=nb.length;
  const out=new Uint8Array(30+n+data.length+46+n+22), dv=new DataView(out.buffer); let p=0;
  dv.setUint32(p,0x04034b50,true);dv.setUint16(p+4,20,true);dv.setUint32(p+14,crc,true);dv.setUint32(p+18,data.length,true);dv.setUint32(p+22,data.length,true);dv.setUint16(p+26,n,true);out.set(nb,p+30);p+=30+n;
  out.set(data,p);p+=data.length; const cd=p;
  dv.setUint32(p,0x02014b50,true);dv.setUint16(p+4,20,true);dv.setUint16(p+6,20,true);dv.setUint32(p+16,crc,true);dv.setUint32(p+20,data.length,true);dv.setUint32(p+24,data.length,true);dv.setUint16(p+28,n,true);out.set(nb,p+46);p+=46+n;
  dv.setUint32(p,0x06054b50,true);dv.setUint16(p+8,1,true);dv.setUint16(p+10,1,true);dv.setUint32(p+12,46+n,true);dv.setUint32(p+16,cd,true);
  return out;
}

const medianOf=a=>{const b=[...a].sort((x,y)=>x-y); return b.length?b[b.length>>1]:0;};
function renderIntervals(){

      rows.map(({g,s},i)=>`<tr><td>${i+1}</td><td>${fmtM(g.dist)} m</td><td>${fmtTime(g.timer)}</td><td>${fmtSpeed(g.timer,g.dist)}</td><td>${s.avgHr!=null?fmtInt(s.avgHr):"–"}</td><td>${s.maxHr??"–"}</td></tr>`).join("")+"</tbody>";
    const tt=work.reduce((a,g)=>a+g.timer,0), dd=work.reduce((a,g)=>a+g.dist,0), hrs=rows.map(r=>r.s.avgHr).filter(v=>v!=null);

    if(rest.length) parts.push(t("kind_rest")+" "+fmtTime(medianOf(rest.map(g=>g.elapsed))));

async function offerFile(filename,data,mime){
  const dl=await downloadsP;
  if(dl){
    try{await dl.save({filename,data:new Blob([data])}); return true;}
    catch(e){toast(e&&e.code==="declined"?t("toast_cancel"):t("toast_nosave",{x:(e&&e.message)||"?"})); return false;}
  }
  // On a phone, the share sheet is how a file reaches Files ("Save to Files") or another app.
  if(TOUCH&&navigator.canShare){
    try{ const f=new File([data],filename,{type:mime||"application/octet-stream"});
      if(navigator.canShare({files:[f]})){ await navigator.share({files:[f]}); return true; } }
    catch(e){ if(e&&e.name==="AbortError"){toast(t("toast_cancel")); return false;} }
  }
  const url=URL.createObjectURL(new Blob([data],{type:mime||"application/octet-stream"}));
  const a=document.createElement("a"); a.href=url; a.download=filename; document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000); return true;
}

const ORIG_MAX=30;
function idb(){ return new Promise((res,rej)=>{ try{ const r=indexedDB.open("tlf",1); r.onupgradeneeded=()=>r.result.createObjectStore("originals",{keyPath:"id"}); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);}catch(e){rej(e);} }); }

async function idbPut(v){ try{ const db=await idb(); await new Promise((res,rej)=>{const tx=db.transaction("originals","readwrite"); tx.objectStore("originals").put(v); tx.oncomplete=res; tx.onerror=()=>rej(tx.error);}); }catch(e){} }
async function idbDel(id){ try{ const db=await idb(); await new Promise((res,rej)=>{const tx=db.transaction("originals","readwrite"); tx.objectStore("originals").delete(id); tx.oncomplete=res; tx.onerror=()=>rej(tx.error);}); }catch(e){} }

  const m=S.model, id=name+"|"+bytes.length;
  await idbPut({id,name,size:bytes.length,added:Date.now(),start:m?m.t0:null,bytes:bytes.slice(0)});
  const all=(await idbAll()).sort((a,b)=>b.added-a.added); for(const x of all.slice(ORIG_MAX)) await idbDel(x.id);
  renderOriginals();
}
async function renderOriginals(){
  const all=(await idbAll()).sort((a,b)=>b.added-a.added);
  $("origCard").hidden=!all.length;
  $("origList").innerHTML=all.map(x=>{const d=fitDate(x.start);return `<div class="orig-row" data-id="${esc(x.id)}"><div style="min-width:0"><b>${esc(x.name)}</b><span class="hint">${d?esc(d.toLocaleString(loc(),{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})):""} · ${fmtDec(x.size/1024,0)} kB</span></div><div class="row"><button class="btn sm" data-oa="open">${esc(t("orig_open"))}</button><button class="btn sm" data-oa="save">${esc(t("orig_save"))}</button><button class="btn sm" data-oa="del">${esc(t("orig_del"))}</button></div></div>`;}).join("");
}
$("origList").addEventListener("click",async e=>{
  const b=e.target.closest("[data-oa]"); if(!b) return; const id=b.closest("[data-id]").dataset.id, x=(await idbAll()).find(o=>o.id===id); if(!x) return;
  if(b.dataset.oa==="open"){ load(new Uint8Array(x.bytes),x.name,false); toast(t("toast_loaded",{n:S.model.laps.length})); $("s2").scrollIntoView({behavior:"smooth"}); }
  else if(b.dataset.oa==="save"){ await offerFile(x.name,new Uint8Array(x.bytes)); }
  else if(b.dataset.oa==="del"){ if(b.dataset.sure){ await idbDel(id); renderOriginals(); } else { b.dataset.sure="1"; b.textContent=t("orig_del_sure"); } }
});

/* ---- Strava: one-tap upload with the person's own API app (keys stay on this device) ---- */
const SV_KEY="tlf-strava";
const svGet=()=>{try{return JSON.parse(localStorage.getItem(SV_KEY)||"{}");}catch(e){return {};}};
const svSet=v=>{try{localStorage.setItem(SV_KEY,JSON.stringify(v));}catch(e){}};
const redirectUri=()=>location.origin+location.pathname;
function renderStrava(){
  if(IS_ARTIFACT||location.protocol!=="https:"&&location.hostname!=="127.0.0.1"&&location.hostname!=="localhost") return;
  $("stravaBox").hidden=false; const sv=svGet();
  $("stravaDomain").textContent=location.hostname;
  $("svId").value=sv.id||""; $("svSecret").value=sv.secret||"";
  $("stravaOn").hidden=!sv.refresh; $("stravaSetup").hidden=!!sv.refresh;
  $("stravaWho").textContent=sv.who||"";
}
async function svToken(){
  const sv=svGet(); if(!sv.refresh) throw new Error(t("sv_not_connected"));
  if(sv.access&&sv.exp>Date.now()/1000+60) return sv.access;
  const r=await fetch("https://www.strava.com/oauth/token",{method:"POST",body:new URLSearchParams({client_id:sv.id,client_secret:sv.secret,grant_type:"refresh_token",refresh_token:sv.refresh})});
  const j=await r.json(); if(!r.ok) throw new Error(j.message||("Strava "+r.status));
  svSet({...sv,access:j.access_token,refresh:j.refresh_token,exp:j.expires_at}); return j.access_token;
}
$("stravaLogin").addEventListener("click",()=>{
  const id=String($("svId").value).trim(), secret=String($("svSecret").value).trim();
  if(!id||!secret){toast(t("sv_need_keys"));return;}
  svSet({...svGet(),id,secret});
  location.href="https://www.strava.com/oauth/authorize?"+new URLSearchParams({client_id:id,response_type:"code",redirect_uri:redirectUri(),approval_prompt:"auto",scope:"activity:write,read"});
});
$("stravaOff").addEventListener("click",()=>{const sv=svGet(); svSet({id:sv.id,secret:sv.secret}); renderStrava(); toast(t("sv_disconnected"));});
async function svFinishLogin(){
  const q=new URLSearchParams(location.search); if(!q.get("code")&&!q.get("error")) return;
  history.replaceState(null,"",location.pathname);
  if(q.get("error")){toast(t("sv_denied"));return;}
  const sv=svGet();
  try{
    const r=await fetch("https://www.strava.com/oauth/token",{method:"POST",body:new URLSearchParams({client_id:sv.id,client_secret:sv.secret,code:q.get("code"),grant_type:"authorization_code"})});
    const j=await r.json(); if(!r.ok) throw new Error(j.message||("Strava "+r.status));
    svSet({...sv,access:j.access_token,refresh:j.refresh_token,exp:j.expires_at,who:j.athlete?[j.athlete.firstname,j.athlete.lastname].filter(Boolean).join(" "):""});
    renderStrava(); toast(t("sv_connected_toast")); $("s4").scrollIntoView();
  }catch(e){toast(t("sv_login_fail",{x:e.message}));}
}
$("stravaUpload").addEventListener("click",async()=>{
  runCheck(); const res=S.last; if(!res||$("save").disabled){toast(t("save_first"));return;}
  const st=$("stravaStatus"), btn=$("stravaUpload"); btn.disabled=true; st.textContent=t("sv_uploading");
  try{
    const tok=await svToken(), fd=new FormData();
    fd.append("file",new Blob([res.file],{type:"application/octet-stream"}),baseName()+".fit"); fd.append("data_type","fit");
    const nm=$("svName").value.trim(), ds=$("svDesc").value.trim(); if(nm) fd.append("name",nm); if(ds) fd.append("description",ds);
    let r=await fetch("https://www.strava.com/api/v3/uploads",{method:"POST",headers:{Authorization:"Bearer "+tok},body:fd}), j=await r.json();
    if(!r.ok) throw new Error(j.message||("Strava "+r.status));
    for(let i=0;i<30&&!j.activity_id&&!j.error;i++){ await new Promise(z=>setTimeout(z,2000)); r=await fetch("https://www.strava.com/api/v3/uploads/"+j.id,{headers:{Authorization:"Bearer "+tok}}); j=await r.json(); }
    if(j.error) throw new Error(/duplicate/i.test(j.error)?t("sv_duplicate"):j.error);
    if(!j.activity_id) throw new Error(t("sv_slow"));
    if($("svHide").checked){ try{ await fetch("https://www.strava.com/api/v3/activities/"+j.activity_id,{method:"PUT",headers:{Authorization:"Bearer "+tok,"Content-Type":"application/json"},body:JSON.stringify({hide_from_home:true})}); }catch(_){} }
    st.innerHTML=esc(t("sv_done"))+` <a href="https://www.strava.com/activities/${encodeURIComponent(j.activity_id)}" target="_blank" rel="noopener">${esc(t("sv_open"))}</a>`;
  }catch(e){ st.textContent=t("sv_fail",{x:e.message}); }
  finally{ btn.disabled=false; }
});
